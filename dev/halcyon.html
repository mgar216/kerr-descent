<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HALCYON — station harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Rajdhani', 'Segoe UI', sans-serif; color: #cfe; }
  canvas#gl { display: block; }
  #hud { position: fixed; left: 10px; top: 8px; font: 12px/1.35 'Share Tech Mono', monospace; color: #8fd; text-shadow: 0 0 4px #000; pointer-events: none; white-space: pre; }
  #prompt { position: fixed; left: 50%; bottom: 14%; transform: translateX(-50%); padding: 6px 14px; border: 1px solid #5ef; background: rgba(0,20,28,.7); font-size: 18px; letter-spacing: .06em; display: none; }
  #cap { position: fixed; left: 50%; bottom: 5%; transform: translateX(-50%); max-width: 70%; padding: 6px 14px; font-size: 17px; background: rgba(0,0,0,.55); border-left: 3px solid #fa4; display: none; }
  #toast { position: fixed; right: 14px; top: 14px; max-width: 340px; padding: 10px 14px; background: rgba(0,20,28,.85); border: 1px solid #5ef; font-size: 15px; display: none; }
  #dlg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.4); }
  #dlg .box { min-width: 380px; max-width: 560px; border: 1px solid #5ef; background: rgba(2,14,20,.95); padding: 12px 16px; }
  #dlg h3 { margin: 0 0 8px; font: 600 14px 'Orbitron', sans-serif; letter-spacing: .2em; color: #5ef; }
  #dlg .opt { padding: 6px 8px; cursor: pointer; border-top: 1px solid #123; font-size: 17px; }
  #dlg .opt:hover { background: #0a2a36; }
  #dlg .opt.done { opacity: .55; }
  #dlg .opt .k { color: #5ef; margin-right: 8px; font-family: 'Share Tech Mono', monospace; }
  #cine { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); text-align: center; display: none; text-shadow: 0 0 10px #000; }
  #cine .a { font: 700 26px 'Orbitron', sans-serif; letter-spacing: .3em; }
  #cine .b { font-size: 18px; opacity: .85; margin-top: 6px; }
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud"></div>
<div id="prompt"></div>
<div id="cap"></div>
<div id="toast"></div>
<div id="cine"><div class="a"></div><div class="b"></div></div>
<div id="dlg"><div class="box"><h3></h3><div class="list"></div></div></div>
<script type="module" src="./halcyon.js"></script>
</body>
</html>
