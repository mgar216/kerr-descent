<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ORPHEUS ship viewer (dev)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#bfeaff;font:12px/1.35 'Share Tech Mono',Consolas,monospace}
  canvas{display:block;width:100vw;height:100vh}
  #ui{position:fixed;left:8px;top:8px;width:230px;background:rgba(4,12,20,.78);border:1px solid rgba(134,236,255,.25);padding:8px;max-height:calc(100vh - 16px);overflow:auto;user-select:none}
  #ui h4{margin:6px 0 3px;font:700 10px Orbitron,sans-serif;letter-spacing:.2em;color:#86ecff}
  #ui button{background:#0a1d2c;color:#bfeaff;border:1px solid rgba(134,236,255,.3);margin:1px;padding:2px 6px;cursor:pointer;font:inherit}
  #ui button.on{background:#1b5a78;color:#fff}
  #ui label{display:block}
  #ui input[type=range]{width:150px;vertical-align:middle}
  #stat{position:fixed;right:8px;top:8px;background:rgba(4,12,20,.6);padding:4px 8px;white-space:pre}
  #log{position:fixed;right:8px;bottom:8px;max-width:360px;background:rgba(4,12,20,.6);padding:4px 8px;white-space:pre-wrap}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui"></div>
<div id="stat"></div>
<div id="log"></div>
<script type="module" src="./ship.js"></script>
</body>
</html>
